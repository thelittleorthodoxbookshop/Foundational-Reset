/* Layout: a shed-wall logbook — one column of stacked cards, tag-style condensed labels, fixed bottom tab bar. */

<script>window.RESET_STANDALONE=true;</script><script>
/* ===== Foundational Reset — guardrail engines (pure, no DOM) ===== */
const DAY = 864e5, HOUR = 36e5;
const pad = n => String(n).padStart(2, '0');
const dateKey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const monthKey = d => dateKey(d).slice(0, 7);
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((fromKey(dateKey(b)) - fromKey(dateKey(a))) / DAY);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

const CAT = {
  water:   { label: 'Water, salt + lemon' },
  broth:   { label: 'Bone broth' },
  fermented: { label: 'Fermented / sauerkraut' },
  softVeg: { label: 'Soft cooked veg' },
  monoFat: { label: 'Avocado / soft fats' },
  tallow:  { label: 'Tallow' },
  protein: { label: 'Lean protein' },
  normal:  { label: 'Normal meal' },
  heavyCarb: { label: 'Heavy carbs' },
  sugar:   { label: 'Sugar' },
  alcohol: { label: 'Alcohol' },
};
const FAST_TYPES = {
  daily:  { label: '16:8 daily fast', target: 16 },
  block3: { label: '3-day block fast', target: 72 },
  block5: { label: '5-day block fast', target: 120 },
};
const ABORT_SYMPTOMS = ['dizzy', 'palpitations', 'confusion', 'fainting', 'vomiting'];
const SYMPTOMS = { dizzy: 'Dizzy on standing', palpitations: 'Palpitations', confusion: 'Confusion', fainting: 'Fainting', vomiting: 'Vomiting', headache: 'Headache', fatigue: 'Fatigue' };
const LOCKOUT_MSG = 'Metabolic Safeguard Active: Your body requires nutritional repletion before the next cellular reset.';

/* ---- flattening helpers over month docs ---- */
function allOf(S, key) {
  return Object.keys(S.months).sort().flatMap(m => S.months[m][key] || []);
}
const allCheckins = S => allOf(S, 'checkins').sort((a, b) => a.t - b.t);
const allWeights = S => allOf(S, 'weights').sort((a, b) => a.t - b.t);
const allWorkouts = S => allOf(S, 'workouts').sort((a, b) => a.t - b.t);
const allMeals = S => allOf(S, 'meals').sort((a, b) => a.t - b.t);
function dayLog(S, k) { const m = S.months[k.slice(0, 7)]; return (m && m.days && m.days[k]) || {}; }

/* ---- 4.2 Red flags: locked until cleared in Settings ---- */
function redFlagLocked(S) {
  const cleared = S.profile.redFlagClearedAt || 0;
  return allCheckins(S).some(c => c.t > cleared && (c.rfLeg || c.rfSaddle || c.rfBladder));
}

/* ---- 4.6 Sneeze safeguard ---- */
const SG_TRIGGER = 4, SG_CALM_DAYS = 3;
function safeguard(S, now) {
  const cs = allCheckins(S);
  const trig = cs.filter(c => c.pain >= SG_TRIGGER).pop();
  if (!trig) return { active: false, calm: 0, need: SG_CALM_DAYS };
  let calm = 0;
  for (let d = fromKey(dateKey(trig.t)).getTime() + DAY; d <= fromKey(dateKey(now)).getTime(); d += DAY) {
    const k = dateKey(d);
    const day = cs.filter(c => dateKey(c.t) === k);
    if (day.length && day.every(c => c.pain < SG_TRIGGER)) calm++; else if (k !== dateKey(now)) calm = 0;
  }
  return { active: calm < SG_CALM_DAYS, calm, need: SG_CALM_DAYS, trigger: trig };
}
function painAvg(S, now, days = 7) {
  const cs = allCheckins(S).filter(c => c.t > now - days * DAY);
  return { avg: avg(cs.map(c => c.pain)), n: cs.length };
}
function suggestL4(a) {
  if (a == null) return null;
  return a >= 6 ? 'acute_sneeze_pain' : a >= 4 ? 'vulnerable_bracing' : a >= 1 ? 'stable_functional' : 'resilient';
}
function weightAvg(S, now, days = 7) {
  const w = allWeights(S).filter(x => x.t > now - days * DAY);
  return avg(w.map(x => x.kg));
}

/* ---- 4.3 Fast phases ---- */
function activeFast(S) { return (S.fasts.list || []).find(f => f.state === 'active') || null; }
function elapsedH(f, now) { return ((f.endedAt || now) - f.startedAt) / HOUR; }
function allowedAt(type, h) {
  if (type === 'block3') return h < 48 ? ['water'] : ['water', 'broth'];
  if (type === 'block5') return h < 72 ? ['water'] : ['water', 'broth', 'tallow'];
  return ['water'];
}
function phaseLabel(type, h) {
  if (type === 'block3') return h < 48 ? 'Water, salt + lemon only' : 'Bone broth phase';
  if (type === 'block5') return h < 72 ? 'Water + electrolytes only' : 'Bone broth + tallow phase';
  return 'Water, black tea or coffee';
}
function nextUnlock(type, h) {
  if (type === 'block3' && h < 48) return { what: 'Bone broth', inH: 48 - h };
  if (type === 'block5' && h < 72) return { what: 'Broth + tallow', inH: 72 - h };
  return null;
}
function checkFastIntake(f, cat, now) {
  const h = elapsedH(f, now);
  const ok = allowedAt(f.type, h);
  if (!ok.includes(cat)) return { v: 'blocked', msg: 'Not in this phase. Allowed now: ' + ok.map(c => CAT[c].label).join(', ') + '.' };
  if (cat === 'tallow') {
    const k = dateKey(now);
    const tbsp = (f.intake || []).filter(i => i.cat === 'tallow' && dateKey(i.t) === k).length;
    if (tbsp >= 2) return { v: 'blocked', msg: 'Tallow cap is 2 × 1 tbsp per day.' };
  }
  return { v: 'ok' };
}
function saltLast24(f, now) { return (f.intake || []).filter(i => i.t > now - 24 * HOUR).reduce((s, i) => s + (i.salt || 0), 0); }
function saltWarning(f, now) {
  return f.type !== 'daily' && elapsedH(f, now) >= 24 && saltLast24(f, now) < 3;
}
function refeedDaysFor(f, now) { return (f.type === 'block5' && elapsedH(f, now) >= 72) ? 5 : 3; }

/* ---- 4.4 Refeed state machine ---- */
const R_BASE = ['water', 'broth', 'fermented'];
const R_BANNED = ['alcohol', 'sugar', 'heavyCarb'];
const REFEED = {
  3: { 1: R_BASE, 2: [...R_BASE, 'softVeg', 'monoFat'], 3: [...R_BASE, 'softVeg', 'monoFat', 'protein', 'normal'] },
  5: { 1: R_BASE, 2: R_BASE, 3: [...R_BASE, 'monoFat', 'tallow'], 4: [...R_BASE, 'monoFat', 'tallow', 'protein'], 5: [...R_BASE, 'monoFat', 'tallow', 'protein'] },
};
function openRefeed(S, now) {
  const r = (S.fasts.refeeds || []).slice().sort((a, b) => a.startedOn < b.startedOn ? -1 : 1).pop();
  if (!r) return null;
  const day = daysBetween(fromKey(r.startedOn), now) + 1;
  return day <= r.days ? { ...r, day } : null;
}
function unlockDay(days, cat) {
  for (let d = 1; d <= days; d++) if (REFEED[days][d].includes(cat)) return d;
  return days + 1;
}
function checkRefeed(r, cat, grams) {
  if (R_BANNED.includes(cat)) return { v: 'blocked', msg: `Refeed day ${r.day} of ${r.days}: no ${CAT[cat].label.toLowerCase()} until refeed is complete.` };
  if (!REFEED[r.days][r.day].includes(cat)) {
    const u = unlockDay(r.days, cat);
    return { v: 'warn', msg: `${CAT[cat].label} unlocks on ${u > r.days ? 'completion' : 'day ' + u}. Log anyway?` };
  }
  if (r.days === 5 && cat === 'protein' && grams > 150) return { v: 'blocked', msg: 'Keep protein to 150 g portions on refeed days 4–5.' };
  if (r.days === 3 && r.day === 1 && cat === 'fermented' && grams > 30) return { v: 'warn', msg: 'Small portions only on day 1 (about 2 tbsp). Log anyway?' };
  return { v: 'ok' };
}

/* ---- 4.5 Macro-cycle + interstitial guardrail ---- */
function endedBlocks(S) {
  return (S.fasts.list || []).filter(f => f.type !== 'daily' && (f.state === 'completed' || f.state === 'aborted'))
    .sort((a, b) => a.endedAt - b.endedAt);
}
function macroPhase(S, now) {
  const act = activeFast(S);
  const ended = endedBlocks(S);
  if (act && act.type !== 'daily') return { key: ended.length ? 'block2' : 'block1', label: ended.length ? 'Block Fast 2' : 'Block Fast 1' };
  if (!ended.length) return { key: 'pre_block1', label: 'Pre-reset' };
  const r = openRefeed(S, now);
  const last = ended[ended.length - 1];
  if (r) return { key: ended.length === 1 ? 'refeed1' : 'refeed2', label: `Refeed · day ${r.day} of ${r.days}` };
  const d = daysBetween(last.endedAt, now);
  if (ended.length === 1) return { key: 'interstitial', label: `Interstitial · day ${d}`, day: d };
  return { key: 'maintenance', label: `Maintenance · day ${d}`, day: d };
}
function weightDownOrStable(ws) {
  if (ws.length < 6) return false;
  const first = avg(ws.slice(0, 3).map(w => w.kg));
  const last = avg(ws.slice(-3).map(w => w.kg));
  return last <= first + 0.3;
}
function canStartBlock(S, now) {
  const p = S.profile;

/* ---------- Fast ---------- */
function vFast(c) {
  let h = header(c, 'Fast') + banners(c) + fastCard(c, false);
  if (c.fast) {
    const f = c.fast, eh = elapsedH(f, c.now), ok = allowedAt(f.type, eh);
    const intakeBtns = [['water', 'Salt water 250 ml'], ...(f.type !== 'daily' ? [['broth', 'Bone broth 250 ml']] : []), ...(f.type === 'block5' ? [['tallow', 'Tallow 1 tbsp']] : [])];
    h += `<div class="card"><h2>Log intake</h2><div class="grid-food">${intakeBtns.map(([cat, l]) => `<button class="${ok.includes(cat) ? '' : 'locked'}" data-act="intake" data-cat="${cat}">${l}${ok.includes(cat) ? '' : '<small>Not yet</small>'}</button>`).join('')}</div>
      ${UI.msg.intake ? `<div class="msg ${UI.msg.intake.v === 'blocked' ? 'danger' : 'ok'}">${esc(UI.msg.intake.msg)}</div>` : ''}
      ${f.type !== 'daily' ? `<p class="small">Salt in last 24 h: <span class="num">${saltLast24(f, c.now)}</span> servings (1 = ⅛ tsp, aim 3+)</p>` : ''}
      ${(f.intake || []).length ? `<div class="list">${f.intake.slice(-5).reverse().map(i => `<div class="li"><span>${CAT[i.cat].label}</span><span class="muted">${fmtDate(i.t)} ${fmtTime(i.t)}</span></div>`).join('')}</div>` : ''}</div>
    <div class="card"><h2>How do you feel?</h2><div class="btns">${Object.entries(SYMPTOMS).map(([k, l]) => `<button class="sm ${ABORT_SYMPTOMS.includes(k) ? 'danger' : ''}" data-act="symptom" data-s="${k}">${l}</button>`).join('')}</div>
      <p class="muted small">Red-outlined symptoms end the fast and start the refeed.</p></div>
    <div class="card">${f.type === 'daily' && UI.pickEnd ? `<form data-form="endEarlier" class="row" style="flex-wrap:nowrap;gap:8px"><label class="f" style="flex:1">First meal at<input id="f-end" type="time" value="${hhmm(c.now)}"></label><button class="sm primary">Finish</button><button class="sm" type="button" data-act="cancelPickEnd">Cancel</button></form>` : ''}
    <div class="btns">${f.type === 'daily' && !UI.pickEnd ? `<button class="${eh >= f.targetH ? 'primary' : ''}" data-act="endFast" data-how="${eh >= f.targetH ? 'completed' : 'aborted'}">${eh >= f.targetH ? 'Finish fast now' : 'End fast now'}</button><button data-act="pickEnd">Ate earlier…</button>` : f.type === 'daily' ? '' : eh >= f.targetH ? `<button class="primary" data-act="endFast" data-how="completed">Finish fast</button>` : UI.confirmEnd ? `<button class="danger" data-act="endFast" data-how="aborted">Yes, end early</button><button data-act="cancelEnd">Keep going</button>` : `<button data-act="askEnd">End early</button>`}</div></div>`;
  } else if (c.refeed) {
    h += refeedGrid(c);
  } else {
    h += mealsCard(c);
  }
  const g = c.gate;
  h += `<div class="card"><div class="row"><h2>Block fast</h2>${g.type ? `<span class="tag plain">${FAST_TYPES[g.type].label}</span>` : ''}</div>`;
  if (g.ok) h += `<p>${g.type === 'block3' ? '48 h water, salt + lemon, then 24 h bone broth. Refeed runs 3 days after.' : '72 h water + electrolytes, then 48 h broth + tallow. Refeed runs 5 days after.'}</p><div class="btns"><button class="primary" data-act="startBlock">Start ${FAST_TYPES[g.type].label}</button></div>`;
  else if (g.lockout) h += `<div class="lock"><b>${LOCKOUT_MSG}</b><ul>${g.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`;
  else h += `<p class="muted">${esc(g.reasons.join(' '))}</p>`;
  h += `</div>`;
  const hist = (S.fasts.list || []).filter(f => f.endedAt).slice(-6).reverse();
  if (hist.length) h += `<div class="card"><h2>Recent fasts</h2><div class="list">${hist.map(f => `<div class="li"><span>${FAST_TYPES[f.type].label}${f.state === 'aborted' ? ' (ended early)' : ''}</span><span class="num">${fmtH(elapsedH(f))} h</span></div>`).join('')}</div></div>`;
  return h;
}
function refeedGrid(c) {
  const r = c.refeed;
  const cats = ['broth', 'fermented', 'softVeg', 'monoFat', 'tallow', 'protein', 'normal'];
  const today = allMeals(S).filter(m => dateKey(m.t) === c.k);
  const m = UI.msg.meal;
  return `<div class="card"><div class="row"><h2>Refeed food log</h2><span class="tag warn">Day ${r.day} of ${r.days}</span></div>
    <div class="grid-food">${cats.map(cat => { const open = REFEED[r.days][r.day].includes(cat); return `<button class="${open ? '' : 'locked'}" data-act="meal" data-cat="${cat}">${CAT[cat].label}${open ? '' : `<small>${unlockDay(r.days, cat) > r.days ? 'After refeed' : 'Day ' + unlockDay(r.days, cat)}</small>`}</button>`; }).join('')}</div>
    <label class="f">Portion (g), for protein and sauerkraut<input id="m-g" type="number" inputmode="numeric" min="0" step="10" placeholder="e.g. 150"></label>
    ${m ? `<div class="msg ${m.v === 'blocked' ? 'danger' : m.v === 'warn' ? 'warn' : 'ok'}">${esc(m.msg)}${m.v === 'warn' ? ` <button class="sm" data-act="mealOverride">Log anyway</button>` : ''}</div>` : ''}
    ${today.length ? `<div class="list">${today.slice().reverse().map(x => `<div class="li"><span>${CAT[x.cat].label}${x.g ? ' · ' + x.g + ' g' : ''}${x.verdict === 'overridden' ? ' (overridden)' : ''}</span><span class="muted">${fmtTime(x.t)}</span></div>`).join('')}</div>` : ''}
    <p class="muted small">Alcohol, sugar and heavy carbs stay off until the refeed finishes.</p></div>`;
}
function mealsCard(c) { return ketoCard(c, false); }

/* ---------- Progress ---------- */
function vProgress(c) {
  const ws = allWeights(S), cs = allCheckins(S);
  const p = S.profile;
  const w7 = weightAvg(S, c.now, 7);
  const firstPain = cs.length ? avg(cs.filter(x => x.t < cs[0].t + 7 * DAY).map(x => x.pain)) : null;
  const pa = painAvg(S, c.now, 7).avg;
  const lastHi = cs.filter(x => x.pain >= 4).pop();
  let streak = 0; for (let t = c.now; ; t -= DAY) { if (dayLog(S, dateKey(t)).kettle) streak++; else if (dateKey(t) !== c.k) break; if (streak > 999) break; }
  const head = ws.length && cs.length
    ? `Down ${(p.startKg - (w7 ?? ws[ws.length - 1].kg)).toFixed(1)} kg since start. Back pain average ${firstPain != null && pa != null ? 'from ' + firstPain.toFixed(1) + ' to ' + pa.toFixed(1) : 'tracking'}.`
    : 'Log weigh-ins and back check-ins. Both lines heading down together is the goal.';
  const sug = suggestL4(pa);
  return header(c, 'Progress') + `
  <div class="card"><p style="font-size:19px"><b>${esc(head)}</b></p>${chartSvg(c)}
  <div class="legend"><span><i style="background:var(--chart-w)"></i>Weight, 7-day avg (kg)</span><span><i style="background:var(--chart-p)"></i>Back pain, 7-day avg (0–10)</span><span><i style="background:var(--band);height:10px"></i>Target ${p.targetMin}–${p.targetMax} kg</span></div>
  <p class="muted small">Shows a trend over time, not proof that one causes the other.</p></div>
  <div class="card"><div class="row"><h2>Keto trial</h2><span class="muted small">${(() => { const t = ketoTrial(c.now); return t.done ? 'Complete' : t.dayNo < 1 ? 'Not started' : 'Day ' + t.dayNo + ' of ' + KETO_DAYS; })()}</span></div>
    <p><b>${esc(ketoCompareText(ketoTrial(c.now)))}</b></p>${ketoChart(c)}
    <div class="legend"><span><i style="background:var(--keto);height:10px"></i>Ketone level (morning)</span><span><i style="background:var(--chart-p)"></i>Morning back pain (0–10)</span></div>
    <p class="muted small">“Other days” includes mornings you didn’t test. Weight loss, sleep and training change back pain too, so read this as a pattern to watch, not proof.</p></div>
  <div class="card"><div class="stats">
    <div class="stat"><span>To target band</span><span class="num">${w7 != null ? Math.max(0, w7 - p.targetMax).toFixed(1) : '–'}</span><span>kg</span></div>
    <div class="stat"><span>Since last 4+ pain</span><span class="num">${lastHi ? daysBetween(lastHi.t, c.now) : '–'}</span><span>days</span></div>
    <div class="stat"><span>Kettle streak</span><span class="num">${streak}</span><span>days</span></div></div></div>
  <div class="card"><div class="row"><h2>L4 status</h2><span class="tag">${L4[p.l4]}</span></div>
    ${sug && sug !== p.l4 ? `<p class="small">Your last 7 days suggest <b>${L4[sug]}</b>.</p><div class="btns"><button class="sm" data-act="setL4" data-v="${sug}">Update to ${L4[sug]}</button></div>` : `<p class="muted small">Matches your recent check-ins.</p>`}</div>
  <div class="card"><h2>Recent check-ins</h2>${cs.length ? `<div class="list">${cs.slice(-6).reverse().map(x => `<div class="li"><span>${fmtDate(x.t)} ${fmtTime(x.t)} · ${esc(x.trigger)}${x.side ? ' · ' + esc(x.side) : ''}</span><span class="num">${x.pain}/10</span></div>`).join('')}</div>` : '<p class="muted small">None yet. Use the Sneeze test button on Today.</p>'}</div>`;
}
function rolling(points, days) {
  return points.map((pt, i) => { const win = points.filter(q => q.t <= pt.t && q.t > pt.t - days * DAY); return { t: pt.t, v: avg(win.map(q => q.v)) }; });
}
function chartSvg(c) {
  const W = 400, H = 240, L = 34, R = 30, T = 12, B = 26;
  const p = S.profile;
  let ws = allWeights(S).map(w => ({ t: w.t, v: w.kg }));
  let cs = allCheckins(S).map(x => ({ t: x.t, v: x.pain }));
  const example = !ws.length && !cs.length;
  if (example) {
    const s = c.now - 60 * DAY;
    ws = Array.from({ length: 30 }, (_, i) => ({ t: s + i * 2 * DAY, v: 97 - i * 0.22 + Math.sin(i) * 0.4 }));
    cs = Array.from({ length: 30 }, (_, i) => ({ t: s + i * 2 * DAY, v: Math.max(0, 6 - i * 0.17 + Math.cos(i) * 0.8) }));
  }
  const all = [...ws, ...cs].map(x => x.t);
  const t0 = Math.min(...all), t1 = Math.max(c.now, ...all), span = Math.max(DAY, t1 - t0);
  const wMax = Math.max(98, ...ws.map(x => x.v + 0.5)), wMin = Math.min(78, ...ws.map(x => x.v - 0.5));
  const x = t => L + (t - t0) / span * (W - L - R);
  const yw = v => T + (wMax - v) / (wMax - wMin) * (H - T - B);
  const yp = v => T + (10 - v) / 10 * (H - T - B);
  const line = (pts, y) => pts.length ? 'M' + pts.map(q => x(q.t).toFixed(1) + ' ' + y(q.v).toFixed(1)).join(' L') : '';
  const wr = rolling(ws, 7), pr = rolling(cs, 7);
  const wTicks = []; for (let v = Math.ceil(wMin / 5) * 5; v <= wMax; v += 5) wTicks.push(v);
  const events = example ? [] : (S.fasts.list || []).filter(f => f.type !== 'daily').map(f => ({ t: f.startedAt, l: f.type === 'block3' ? 'B1' : 'B2' }));
  const fmtD = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
  const lw = wr[wr.length - 1], lp = pr[pr.length - 1];
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight and back pain over time">
    <rect x="${L}" y="${yw(p.targetMax)}" width="${W - L - R}" height="${yw(p.targetMin) - yw(p.targetMax)}" fill="var(--band)"/>
    ${wTicks.map(v => `<line x1="${L}" x2="${W - R}" y1="${yw(v)}" y2="${yw(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yw(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('')}
    ${[0, 5, 10].map(v => `<text x="${W - R + 6}" y="${yp(v) + 4}" font-size="11" fill="var(--chart-p)">${v}</text>`).join('')}
    ${events.map(e => `<line x1="${x(e.t)}" x2="${x(e.t)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(e.t) + 3}" y="${T + 10}" font-size="10" fill="var(--muted)">${e.l}</text>`).join('')}
    ${ws.map(q => `<circle cx="${x(q.t)}" cy="${yw(q.v)}" r="2" fill="var(--chart-w)" opacity=".25"/>`).join('')}
    <path d="${line(wr, yw)}" fill="none" stroke="var(--chart-w)" stroke-width="2.5" ${example ? 'stroke-dasharray="5 4" opacity=".5"' : ''}/>
    <path d="${line(pr, yp)}" fill="none" stroke="var(--chart-p)" stroke-width="2.5" ${example ? 'stroke-dasharray="5 4" opacity=".5"' : ''}/>
    ${!example && lw ? `<circle cx="${x(lw.t)}" cy="${yw(lw.v)}" r="4" fill="var(--chart-w)"/>` : ''}
    ${!example && lp ? `<circle cx="${x(lp.t)}" cy="${yp(lp.v)}" r="4" fill="var(--chart-p)"/>` : ''}
    <text x="${L}" y="${H - 8}" font-size="11" fill="var(--muted)">${fmtD(t0)}</text><text x="${W - R}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtD(t1)}</text>
    ${example ? `<text x="${(W + L - R) / 2}" y="${H / 2}" text-anchor="middle" font-size="14" fill="var(--muted)">Example — your lines appear here</text>` : ''}
  </svg></div>`;
}

  <div class="card"><h2>Guardrails</h2>

    <label class="f">Pushup stage<select id="p-pushupStage" data-prof="pushupStage"><option value="incline" ${p.pushupStage !== 'floor' ? 'selected' : ''}>Incline bench</option><option value="floor" ${p.pushupStage === 'floor' ? 'selected' : ''}>Floor</option></select></label>

  </div>
  ${IN_CLAUDE ? '' : (() => { const cfg = syncCfg() || {}; return `<div class="card"><h2>Sync</h2>

    </form></div>`; })()}
  <div class="card"><h2>Backup</h2>

  <div class="card"><h2>About this build</h2><p class="small muted">${IN_CLAUDE ? 'Your log is private to you and saved to your account, so it follows you across devices.' : 'Your log is cached on this phone and synced to your Google Sheet.'} The morning kettle prompt needs a phone alarm; web pages can’t send notifications.</p></div>`;
}

/* ---------- timer overlay ---------- */
let audio = null, wakeLock = null;
function beep(f = 880, d = .15) {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.25, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d); o.start(); o.stop(audio.currentTime + d); } catch (e) {}
}
async function lockWake() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
function openTimer(cfg) {
  beep(660, .05); lockWake();
  UI.timer = { ...cfg, start: Date.now(), phase: 'work', side: 'Left', rounds: 0, restEnd: 0, lastBeep: null };
  paintTimer();
  UI.timer.iv = setInterval(tickTimer, 200);
}
function closeTimer(done) {
  const t = UI.timer; if (!t) return;
  clearInterval(t.iv); UI.timer = null; $('#timer').hidden = true; $('#timer').innerHTML = '';
  try { wakeLock && wakeLock.release(); } catch (e) {}
  if (t.onClose) t.onClose(done, t);
  render();
}
function tickTimer() {
  const t = UI.timer; if (!t) return;
  const now = Date.now();
  const left = t.secs - (now - t.start) / 1000;
  if (t.mode === 'amrap' && t.phase === 'rest' && now >= t.restEnd) { t.phase = 'work'; beep(990, .2); }
  const watch = t.mode === 'amrap' && t.phase === 'rest' ? (t.restEnd - now) / 1000 : left;
  const s = Math.ceil(watch);
  if (s !== t.lastBeep && s <= 3 && s >= 1) { beep(); t.lastBeep = s; }
  if (left <= 0) { beep(440, .6); closeTimer(true); return; }
  paintTimer();
}
function paintTimer() {
  const t = UI.timer, el = $('#timer'); if (!t) return;
  const now = Date.now(), left = t.secs - (now - t.start) / 1000;
  el.hidden = false;
  el.className = 'timer' + (t.mode === 'amrap' && t.phase === 'rest' ? ' rest' : '');
  const big = t.mode === 'amrap' && t.phase === 'rest' ? fmtClock((t.restEnd - now) / 1000) : fmtClock(left);
  el.innerHTML = `<div class="row"><h2>${esc(t.title)}</h2><button class="sm" data-act="timerStop">${t.mode === 'amrap' ? 'Finish' : 'Stop'}</button></div>
    <div class="mid"><div class="clock">${big}</div>
    ${t.mode === 'amrap' ? `<p class="tag ${t.phase === 'rest' ? 'warn' : ''}" style="justify-self:center">${t.phase === 'rest' ? 'Rest · then ' + t.side + ' arm' : t.side + ' arm · round ' + (t.rounds + 1)}</p><p class="muted">${fmtClock(left)} left in the AMRAP</p>` : ''}
    <p class="cue">${esc(t.cue)}</p></div>
    ${t.mode === 'amrap' ? `<div class="btns" style="justify-content:center"><button class="primary" data-act="sideDone" ${t.phase === 'rest' ? 'disabled' : ''}>Side done</button><button data-act="formBroke" ${t.phase === 'rest' ? 'disabled' : ''}>Form broke</button></div>` : '<span></span>'}`;
}

/* ---------- actions ---------- */
function toast(m) { UI.toast = m; render(); clearTimeout(UI.tt); UI.tt = setTimeout(() => { UI.toast = null; $('#toast').hidden = true; }, 2600); }
function go(v) { UI.view = v; UI.msg = {}; UI.confirmEnd = UI.confirmClear = false; try { history.replaceState(null, '', '#' + v); } catch (e) {} render(); try { window.scrollTo(0, 0); } catch (e) {} }
/* "HH:MM" -> timestamp in the last 24 h (a time later than now means yesterday) */
function pastTime(hhmm, now) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || ''); if (!m) return null;
  const d = new Date(now); d.setHours(+m[1], +m[2], 0, 0);
  let t = d.getTime(); if (t > now + 60000) t -= DAY;
  return t;
}
const hhmm = t => fmtTime(t);
function whenLabel(t, now) { return fmtTime(t) + (dateKey(t) === dateKey(now) ? ' today' : dateKey(t) === dateKey(now - DAY) ? ' yesterday' : ' ' + fmtDate(t)); }
function startFast(type, at) {
  const now = Date.now();
  S.fasts.list.push({ id: uid(), type, state: 'active', startedAt: at || now, targetH: FAST_TYPES[type].target, intake: [], symptoms: [] });
  save('fasts'); render();
}
function endFast(how, reason, at) {
  const f = activeFast(S); if (!f) return;
  const now = at && at > f.startedAt ? at : Date.now();
  f.state = how; f.endedAt = now; if (reason) f.abortReason = reason;
  if (f.type !== 'daily') S.fasts.refeeds.push({ id: uid(), fastId: f.id, days: refeedDaysFor(f, now), startedOn: dateKey(now) });
  const k = dateKey(now), dd = day(k); dd.fastH = Math.max(dd.fastH || 0, Math.round(elapsedH(f, now) * 10) / 10);
  UI.confirmEnd = false; UI.pickEnd = false;
  save('fasts'); saveMonth(now);
  toast(f.type === 'daily' ? 'Fast logged: ' + fmtH(elapsedH(f, now)) + ' h' : 'Fast ended. Refeed protection is on.');
}
function logMeal(cat, override) {
  const now = Date.now(), r = openRefeed(S, now);
  const g = Number(($('#m-g') || {}).value) || null;
  let verdict = 'allowed';
  if (r) {
    const v = checkRefeed(r, cat, g || 0);
    if (v.v === 'blocked') { UI.msg.meal = v; render(); return; }
    if (v.v === 'warn' && !override) { UI.msg.meal = v; UI.pendingMeal = cat; render(); return; }
    if (v.v === 'warn') verdict = 'overridden';
  }
  month(now).meals.push({ t: now, cat, g, refeedDay: r ? r.day : null, verdict });
  if (cat === 'broth') { const dd = day(dateKey(now)); dd.broth = (dd.broth || 0) + 250; }
  if (cat === 'alcohol') day(dateKey(now)).alcohol = true;
  UI.msg.meal = (!r && (cat === 'alcohol' || cat === 'sugar')) ? { v: 'warn', msg: 'Logged. The plan is zero alcohol and zero sugar.' } : { v: 'ok', msg: CAT[cat].label + ' logged.' };
  UI.pendingMeal = null; saveMonth(now); render();
}
function saveSession() {
  const dr = UI.draft, now = Date.now(), k = dateKey(now);
  const items = dr.items.map(it => ({ ex: it.ex, kind: it.kind, rounds: it.rounds, sets: it.sets.map(s => ({ reps: it.kind === 'reps' ? s.reps : null, secs: it.kind === 'time' ? (s.done ? s.secs : 0) : null, metres: it.kind === 'distance' ? (s.done ? s.metres : 0) : null, ok: s.ok })) }));
  month(now).workouts.push({ t: now, date: k, day: dr.dayKey, title: dr.title, downgraded: dr.downgraded, items });
  day(k).workout = true;
  let note = 'Session saved.';
  const inc = items.find(i => i.ex === 'incline');
  if (inc && S.profile.pushupStage !== 'floor' && earnsFloorPushup(inc.sets)) { S.profile.pushupStage = 'floor'; save('profile'); note = 'Session saved. Floor pushups unlocked.'; }
  UI.draft = null; UI.msg.train = note; saveMonth(now); render();
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-view]'); if (tab) return go(tab.dataset.view);
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closeSheet"]')) return;
  const act = a.dataset.act, now = Date.now(), k = dateKey(now);
  const it = a.dataset.i != null && UI.draft ? UI.draft.items[+a.dataset.i] : null;
  switch (act) {
    case 'startDaily': return startFast('daily');
    case 'exportBackup': return exportBackup();
    case 'syncOff': try { localStorage.removeItem('reset-sync'); } catch (x) {} return location.reload();
    case 'pickStart': UI.pickStart = true; return render();
    case 'cancelPickStart': UI.pickStart = false; return render();
    case 'editStart': UI.editStart = true; return render();
    case 'cancelEditStart': UI.editStart = false; return render();
    case 'pickEnd': UI.pickEnd = true; return render();
    case 'cancelPickEnd': UI.pickEnd = false; return render();
    case 'startBlock': { const gt = canStartBlock(S, now); if (gt.ok) startFast(gt.type); return; }
    case 'askEnd': UI.confirmEnd = true; return render();
    case 'cancelEnd': UI.confirmEnd = false; return render();
    case 'endFast': return endFast(a.dataset.how);
    case 'intake': {
      const f = activeFast(S); if (!f) return;
      const v = checkFastIntake(f, a.dataset.cat, now);
      if (v.v === 'blocked') { UI.msg.intake = v; return render(); }
      f.intake.push({ t: now, cat: a.dataset.cat, ml: a.dataset.cat === 'tallow' ? 0 : 250, salt: a.dataset.cat === 'water' ? 1 : 0 });
      if (a.dataset.cat === 'broth') { const dd = day(k); dd.broth = (dd.broth || 0) + 250; saveMonth(now); }
      UI.msg.intake = { v: 'ok', msg: CAT[a.dataset.cat].label + ' logged.' };
      save('fasts'); return render();
    }
    case 'symptom': {
      const f = activeFast(S); if (!f) return;
      f.symptoms.push({ t: now, s: a.dataset.s });
      if (ABORT_SYMPTOMS.includes(a.dataset.s)) { save('fasts'); return endFast('aborted', a.dataset.s); }
      UI.msg.intake = { v: 'ok', msg: SYMPTOMS[a.dataset.s] + ' noted. If it gets worse, end the fast.' };
      save('fasts'); return render();
    }
    case 'meal': return logMeal(a.dataset.cat, false);
    case 'mealOverride': return UI.pendingMeal && logMeal(UI.pendingMeal, true);
    case 'kettleTimer': return openTimer({ title: 'Kettle squat', secs: 60, cue: EX.kettle.cue, onClose: done => { if (done) { day(dateKey(Date.now())).kettle = true; saveMonth(Date.now()); toast('Kettle squat done.'); } } });
    case 'hangTimer': { const sg = safeguard(S, now).active; const secs = sg ? 30 : 25; return openTimer({ title: sg ? 'Foot-assisted traction' : 'Active hang', secs, cue: (sg ? EX.traction : EX.hang).cue, onClose: (done, t) => { const used = done ? secs : Math.floor((Date.now() - t.start) / 1000); if (used > 3) { const dd = day(dateKey(Date.now())); dd.hangSecs = (dd.hangSecs || 0) + used; saveMonth(Date.now()); } } }); }
    case 'broth': { const dd = day(k); dd.broth = (dd.broth || 0) + 250; saveMonth(now); return render(); }
    case 'checkin': case 'morningCheckin': {
      const morning = act === 'morningCheckin' || new Date(now).getHours() < 11;
      const kt = dayLog(S, k).ketone;
      UI.sheet = { type: 'checkin', pain: 2, trigger: morning ? 'morning' : 'sneeze', side: 'left', rfLeg: false, rfSaddle: false, rfBladder: false, kLevel: kt ? kt.level : null, mmol: kt && kt.mmol != null ? kt.mmol : null, glu: dayLog(S, k).glucose != null ? dayLog(S, k).glucose : null };
      return render();
    }
    case 'closeSheet': UI.sheet = null; return render();
    case 'ciSet': { const v = a.dataset.v; UI.sheet[a.dataset.k] = v === '0' ? false : v === '1' ? true : v; return render(); }
    case 'saveCheckin': {
      const s = UI.sheet;
      let ketone = null;
      if (s.trigger === 'morning') {
        const mm = s.mmol != null && isFinite(s.mmol) && s.mmol >= 0 ? Math.round(s.mmol * 10) / 10 : null;
        const level = mm != null ? levelFromMmol(mm) : s.kLevel;
        if (level) { ketone = { level, mmol: mm, t: now }; day(k).ketone = ketone; }
        if (s.glu != null && isFinite(s.glu) && s.glu > 0) day(k).glucose = Math.round(s.glu * 10) / 10;
      }
      month(now).checkins.push({ t: now, pain: +s.pain, trigger: s.trigger, side: s.side, rfLeg: s.rfLeg, rfSaddle: s.rfSaddle, rfBladder: s.rfBladder, ketone, glucose: s.glu != null && isFinite(s.glu) && s.glu > 0 ? Math.round(s.glu * 10) / 10 : null });
      UI.sheet = null; saveMonth(now);
      return toast(s.rfLeg || s.rfSaddle || s.rfBladder ? 'Red flag saved. See a doctor today.' : +s.pain >= 4 ? 'Saved. Safeguard is on.' : 'Check-in saved.');
    }
    case 'pickDay': UI.trainDow = +a.dataset.dow; UI.msg.train = null; return render();
    case 'step': { const s = it.sets[+a.dataset.s]; s.reps = Math.max(0, Math.min(it.cap || 50, s.reps + +a.dataset.d)); return render(); }
    case 'roundStep': it.rounds = Math.max(0, (it.rounds || 0) + +a.dataset.d); return render();
    case 'toggleSet': { const s = it.sets[+a.dataset.s]; s.done = !s.done; return render(); }
    case 'setTimer': { const s = it.sets[+a.dataset.s]; return openTimer({ title: EX[it.ex].name + ' · set ' + (+a.dataset.s + 1), secs: s.secs, cue: EX[it.ex].cue, onClose: done => { if (done) s.done = true; } }); }
    case 'amrap': return openTimer({ title: EX[it.ex].name, secs: it.minutes * 60, mode: 'amrap', rest: it.rest, cue: EX[it.ex].cue, onClose: (done, t) => { it.rounds = t.rounds; } });
    case 'sideDone': case 'formBroke': {
      const t = UI.timer; if (!t || t.phase === 'rest') return;
      if (t.side === 'Right' && act === 'sideDone') t.rounds++;
      t.side = t.side === 'Left' ? 'Right' : 'Left';
      if (t.rest > 0) { t.phase = 'rest'; t.restEnd = Date.now() + t.rest * 1000; }
      beep(520, .1); return paintTimer();
    }
    case 'timerStop': return closeTimer(false);
    case 'saveSession': return saveSession();
    case 'setL4': S.profile.l4 = a.dataset.v; save('profile'); return render();
    case 'askClear': UI.confirmClear = true; return render();
    case 'cancelClear': UI.confirmClear = false; return render();
    case 'commuteMode': S.profile.commuteMode = a.dataset.v; save('profile'); return render();
    case 'logCommute': {
      const cp = commutePlan(now);
      const rem = [];
      if (cp.mode === 'cycle') rem.push({ id: 'hip', done: false });
      if (cp.xero) rem.push({ id: 'calf', done: false });
      const m = month(now); (m.commutes || (m.commutes = [])).push({ t: now, mode: cp.mode, km: cp.km, partial: cp.km < ROUTE_KM, xero: cp.xero,
        alignMin: cp.mode === 'walk' ? Math.round(WALK_ALIGN_MIN * cp.km / ROUTE_KM) : 0, reminders: rem });
      saveMonth(now);
      return toast(cp.mode === 'cycle' ? 'Ride logged. Hip flexor stretch when you arrive.' : `Walk logged: ${Math.round(WALK_ALIGN_MIN * cp.km / ROUTE_KM)} min alignment.`);
    }
    case 'commuteStretch': {
      const t = +a.dataset.t, x = (month(t).commutes || []).find(e => e.t === t); if (!x) return;
      const r = x.reminders.find(q => q.id === a.dataset.r);
      return openTimer({ title: STRETCH[r.id].label, secs: 30, cue: STRETCH[r.id].cue, onClose: done => { if (done) { r.done = true; saveMonth(t); } } });
    }
    case 'clearRF': S.profile.redFlagClearedAt = Date.now(); UI.confirmClear = false; save('profile'); return toast('Red flag cleared.');
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'formOk') { UI.draft.items[+el.dataset.i].sets[+el.dataset.s].ok = el.checked; return; }
  if (el.dataset.act === 'brothMeal1') { day(dateKey(Date.now())).brothMeal1 = el.checked; saveMonth(Date.now()); return render(); }
  if (el.dataset.act === 'xero') { S.profile.xero = el.checked; if (el.checked && !S.profile.xeroSince) S.profile.xeroSince = dateKey(Date.now()); save('profile'); return render(); }
  if (el.id === 's-import' && el.files && el.files[0]) { importBackup(el.files[0]); el.value = ''; return; }
  if (el.dataset.act === 'ketoTick') { day(dateKey(Date.now()))[el.dataset.k] = el.checked; saveMonth(Date.now()); return render(); }
  if (el.dataset.act === 'alcohol') { day(dateKey(Date.now())).alcohol = el.checked; saveMonth(Date.now()); return render(); }
  if (el.dataset.prof) {
    const key = el.dataset.prof;
    let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
    if (el.type === 'number' && !isFinite(v)) return;
    S.profile[key] = v; save('profile');
    if (el.type === 'checkbox' || el.tagName === 'SELECT') render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'k-glu' && UI.sheet) { const v = e.target.value; UI.sheet.glu = v === '' ? null : Number(v); return; }
  if (e.target.id === 'k-mmol' && UI.sheet) { const v = e.target.value; UI.sheet.mmol = v === '' ? null : Number(v); return; }
  if (e.target.id === 'c-pain' && UI.sheet) { UI.sheet.pain = +e.target.value; $('#painv').textContent = e.target.value; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const now = Date.now();
  if (e.target.dataset.form === 'sync') {
    const url = $('#s-url').value.trim(), code = $('#s-code').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return toast('The address should start https://script.google.com and end /exec.');
    if (!code) return toast('Enter the access code from the Setup tab.');
    toast('Checking…');
    return gasCall(url, code, { op: 'list' }).then(() => {
      try { localStorage.setItem('reset-sync', JSON.stringify({ url, code })); } catch (x) {}
      location.reload();
    }).catch(err => toast(err && err.code === 'bad_code' ? 'Access code doesn’t match the sheet.' : err && err.code === 'run_setup' ? 'Run setup() in the script first.' : 'Can’t reach that address. Check it was deployed with access “Anyone”.'));
  }
  if (e.target.dataset.form === 'startEarlier') {
    const t = pastTime($('#f-start').value, now); if (t == null) return toast('Pick a time.');
    UI.pickStart = false; startFast('daily', t); return toast('16:8 fast started from ' + whenLabel(t, now) + '.');
  }
  if (e.target.dataset.form === 'editStart') {
    const f = activeFast(S), t = pastTime($('#f-edit').value, now); if (!f || t == null) return;
    f.startedAt = t; UI.editStart = false; save('fasts'); return toast('Start moved to ' + whenLabel(t, now) + '.');
  }
  if (e.target.dataset.form === 'endEarlier') {
    const f = activeFast(S), t = pastTime($('#f-end').value, now); if (!f || t == null) return;
    if (t <= f.startedAt) return toast('That’s before the fast started.');
    return endFast((t - f.startedAt) / HOUR >= f.targetH ? 'completed' : 'aborted', null, t);
  }
  if (e.target.dataset.form === 'weigh') {
    const kg = Number($('#w-kg').value);
    if (!(kg >= 40 && kg <= 250)) return toast('Enter a weight between 40 and 250 kg.');
    const now = Date.now(); month(now).weights.push({ t: now, kg: Math.round(kg * 10) / 10 }); day(dateKey(now)).weighed = true;
    saveMonth(now); $('#w-kg').blur(); toast(kg.toFixed(1) + ' kg logged.');
  }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (['today', 'train', 'fast', 'progress', 'setup'].includes(v) && v !== UI.view) go(v); });
document.addEventListener('visibilitychange', () => { if (document.hidden) cacheLocal(); else if (dirty.size) { retryMs = 3000; flush(); } if (!document.hidden) { if (UI.timer) lockWake(); else render(); } });
setInterval(() => { if (!UI.timer && !UI.sheet && (UI.view === 'today' || UI.view === 'fast') && activeFast(S)) softRender(); }, 30000);
(function boot() { const v = location.hash.slice(1); if (['today', 'train', 'fast', 'progress', 'setup'].includes(v)) UI.view = v; connect(); })();
</script>
